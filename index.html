nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:14px;color:var(--mut)}
nav ul a:hover{color:var(--m)}
@media(max-width:720px){nav ul{display:none}}
.btn{display:inline-block;padding:13px 26px;border-radius:99px;font-weight:600;font-size:15px;background:linear-gradient(120deg,var(--p),var(--b));box-shadow:0 8px 30px rgba(94,70,255,.45);transition:.25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(94,70,255,.7)}
.btn.g{background:transparent;border:1px solid var(--line);box-shadow:none}

.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(10,7,32,.15),var(--bg) 85%)}
@keyframes drift{to{transform:scale(1.12) translate(-2%,2%)}}
.hero .wrap{position:relative;z-index:2}
h1{font-size:clamp(38px,7vw,78px);line-height:1.05;margin:0 0 20px;font-weight:800;letter-spacing:-.03em;max-width:820px}
.grad{background:linear-gradient(100deg,var(--m),#8fa4ff,var(--p),var(--m));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.hero p{color:var(--mut);font-size:18px;max-width:560px;margin:0 0 32px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .in{opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.dot{position:absolute;border-radius:50%;background:var(--m);opacity:.5;animation:fl 9s ease-in-out infinite;z-index:1}
@keyframes fl{50%{transform:translateY(-40px) translateX(14px);opacity:.15}}
section{padding:96px 0;position:relative}
h2{font-size:clamp(28px,4vw,44px);margin:0 0 12px;letter-spacing:-.02em}
.sub{color:var(--mut);max-width:560px;margin:0 0 48px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:-50px;position:relative;z-index:3}
.stat{padding:28px;border-radius:20px;background:linear-gradient(160deg,rgba(124,77,255,.22),rgba(61,90,254,.06));border:1px solid var(--line);backdrop-filter:blur(10px)}
.stat b{display:block;font-size:44px;line-height:1.1;color:var(--m)}
.stat span{color:var(--mut);font-size:14px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.card{position:relative;padding:28px;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:transform .25s,border-color .25s;transform-style:preserve-3d;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(124,77,255,.35),transparent 70%);opacity:0;transition:.3s}
.card:hover{border-color:rgba(59,224,176,.5)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.tag{display:inline-block;font-size:12px;padding:4px 12px;border-radius:99px;background:rgba(59,224,176,.12);color:var(--m);margin:0 6px 6px 0}
.card h3{margin:14px 0 8px;font-size:22px}
.card p,.card li{color:var(--mut);font-size:14.5px}
.card ul{padding-left:18px;margin:10px 0 16px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);transition:.2s}
.links a:hover{background:var(--m);color:#06231a;border-color:var(--m)}
.big{grid-column:1/-1}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;background:var(--bg2)}
.track{display:flex;gap:46px;width:max-content;animation:mq 28s linear infinite;font-size:22px;font-weight:600;color:var(--mut)}
.track span:nth-child(3n){color:var(--m)}
@keyframes mq{to{transform:translateX(-50%)}}
.mk{display:flex;flex-wrap:wrap;gap:14px}
.mk div{flex:1 1 150px;padding:22px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:center;font-weight:600;position:relative}
.mk div::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--m);animation:ping 2.4s infinite}

function useReveal(){const r=useRef();const [on,set]=useState(false);
 useEffect(()=>{const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){set(true);o.disconnect()}},{threshold:.15});o.observe(r.current);return()=>o.disconnect()},[]);return [r,on]}
function Rv({children,d=0,className="",...p}){const [r,on]=useReveal();return <div ref={r} className={"rv "+(on?"on ":"")+className} style={{transitionDelay:d+"ms"}} {...p}>{children}</div>}
function Count({to,suf=""}){const [r,on]=useReveal();const [v,set]=useState(0);
 useEffect(()=>{if(!on)return;let s=null;const f=t=>{s=s||t;const k=Math.min((t-s)/1600,1);set(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)},[on]);
 return <b ref={r}>{v}{suf}</b>}
function Card({children,className="",d=0}){const glow=e=>{const b=e.currentTarget.getBoundingClientRect();const x=e.clientX-b.left,y=e.clientY-b.top;const el=e.currentTarget;el.style.setProperty("--mx",x+"px");el.style.setProperty("--my",y+"px");el.style.transform=`perspective(800px) rotateX(${(y/b.height-.5)*-6}deg) rotateY(${(x/b.width-.5)*6}deg) translateY(-4px)`};
 return <Rv d={d} className={className}><div className="card" onMouseMove={glow} onMouseLeave={e=>e.currentTarget.style.transform=""}>{children}</div></Rv>}
const A=({h,children})=><a href={h} target="_blank" rel="noopener noreferrer">{children}</a>;
function Nav(){const [s,set]=useState(false);useEffect(()=>{const f=()=>set(scrollY>40);f();addEventListener("scroll",f);return()=>removeEventListener("scroll",f)},[]);
 return <nav className={s?"s":""}><div className="wrap"><a href="#top" className="brand"><i className="mark"></i>Qatfa Code</a>
 <ul><li><a href="#about">About</a></li><li><a href="#apps">Apps</a></li><li><a href="#web">Websites</a></li><li><a href="#clients">Clients</a></li></ul>
 <a className="btn" href="#contact" style={{padding:"9px 20px",fontSize:14}}>Contact us</a></div></nav>}

 return <header className="hero" id="top"><div className="bg"></div>
 {dots.map((d,i)=><i key={i} className="dot" style={{left:d[0]+"%",top:d[1]+"%",animationDelay:d[2]+"s",width:d[3],height:d[3]}}></i>)}
 <div className="wrap"><h1 className="in">We build apps that <span className="grad">launch businesses.</span></h1>

function Stats(){return <div className="wrap"><div className="stats">

function About(){return <section id="about"><div className="wrap"><Rv><h2>A small studio that owns the whole product</h2>

function Apps(){return <section id="apps" style={{background:"linear-gradient(var(--bg),var(--bg2),var(--bg))"}}><div className="wrap"><Rv><h2>Apps we shipped</h2><p className="sub">Three products, live on both stores.</p></Rv>
 <div className="grid">
